name: Сборка APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.6'
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      # Постоянный ключ подписи из секретов репозитория. Без него APK
      # подписывается случайным отладочным ключом, и новую сборку нельзя
      # установить поверх старой, не удалив приложение.
      - name: Ключ подписи
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.jks
          cat > android/key.properties <<EOF
          storeFile=release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          EOF

      - run: flutter build apk --release --build-number=${{ github.run_number }}
      - run: mv build/app/outputs/flutter-apk/app-release.apk quizmaster.apk

      - uses: actions/upload-artifact@v4
        with:
          name: quizmaster-apk
          path: quizmaster.apk

      - name: Опубликовать в Releases
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Сборка №${{ github.run_number }}
          make_latest: true
          files: quizmaster.apk
          body: |
            APK для Android. Скачайте quizmaster.apk на телефон и откройте его.
            Коммит: ${{ github.sha }}
